<!DOCTYPE html>

<html lang="">

<head>
    <script type="module" src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title> MKBL Auctions </title>
</head>

<body>

    <h1 style="text-align:center; color:white; "> MKBL Auctions </h1>4

    <div class="adminBar">
        <div class="buttonGr">
            <button class="button1" id="allplayers"> All Players</button>
            <!-- <button class="button1" id="batters"> Batters</button>
            <button class="button1" id="bowlers"> Bowlers</button>
            <button class="button1" id="keepers"> Wicket Keepers</button>-->
            <button class="button1" id="draft"> Draft</button>
        </div>
    </div>

    <div class="adminAlert" id="adminAl">
        Please select a category <br> to begin the auction <br>

    </div>
    <!-- <button class="button2" id="viewSquads" style="margin-left:1em;" display="none" visibility="hidden">
        View Squads
    </button> -->


    <div class="defPlayerDisp" id="defDis" style="display:none;">

        <!-- Spend Modal -->
        <div id="spendModal"
            style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
            <div
                style="background:white; color:black; padding:2em; border-radius:10px; max-width:90vw; margin:auto; text-align:center;">
                <h2>Enter Spend Amount</h2>
                <input type="number" id="spendInput" min="0" style="font-size:1.2em; padding:0.5em; width:60%;" />
                <div id="spendError" style="color:red; margin-top:0.5em; min-height:1.5em;"></div>
                <button id="spendConfirm" style="margin:1em; padding:0.5em 1.5em; font-size:1em;">Confirm</button>
                <button id="spendCancel" style="padding:0.5em 1.5em; font-size:1em;">Cancel</button>
            </div>
        </div>
        <button class="button2" id="randomizer">Randomize</button>

        <!-- Squads Modal -->
        <div id="squadsModal"
            style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
            <div
                style="background:white; color:black; padding:2em; border-radius:10px; max-width:90vw; margin:auto; text-align:center; min-width:300px;">
                <h2>All Captains' Squads</h2>
                <div id="squadsContent" style="text-align:left; max-height:60vh; overflow-y:auto;"></div>
                <button id="squadsClose" style="margin-top:1em; padding:0.5em 1.5em; font-size:1em;">Close</button>
            </div>
        </div>
        <br>
        <ul id="defList"></ul>
        <ul id="randef" style="display:none;"></ul>

        <div id="bidalert"
            style="display:none;text-align:center;margin-top:-3%;
            margin-left:-2%;
            font-size:2vw; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;">
            Accepting bids for
        </div>

        <table id="purseTable" style="float:left; border: 1px solid black; display:none;">
            <tr>
                <td style="text-align:center;"><b>Captain</b></td>
                <td style="text-align:center;"><b>Purse</b></td>
                <td style="text-align:center;"><b>Sq. Size</b></td>
            </tr>


            <tr> <!-- Captain 1 -->
                <td><span id="cp1_Name"></span></td>
                <td><span id="cp1_Purse"></span></td>
                <td><span id="cp1_SqSize"></span></td>
                <td><button id="cp1_Spend">Spend</button></td>
            </tr>
            <tr> <!-- Captain 2 -->
                <td><span id="cp2_Name"></span></td>
                <td><span id="cp2_Purse"></span></td>
                <td><span id="cp2_SqSize"></span></td>
                <td><button id="cp2_Spend">Spend</button></td>
            </tr>
            <tr> <!-- Captain 3 -->
                <td><span id="cp3_Name"></span></td>
                <td><span id="cp3_Purse"></span></td>
                <td><span id="cp3_SqSize"></span></td>
                <td><button id="cp3_Spend">Spend</button></td>
            </tr>
            <tr> <!-- Captain 4 -->
                <td><span id="cp4_Name"></span></td>
                <td><span id="cp4_Purse"></span></td>
                <td><span id="cp4_SqSize"></span></td>
                <td><button id="cp4_Spend">Spend</button></td>
            </tr>
            <tr> <!-- Captain 5 -->
                <td><span id="cp5_Name"></span></td>
                <td><span id="cp5_Purse"></span></td>
                <td><span id="cp5_SqSize"></span></td>
                <td><button id="cp5_Spend">Spend</button></td>
            </tr>
            <tr> <!-- Captain 6 -->
                <td><span id="cp6_Name"></span></td>
                <td><span id="cp6_Purse"></span></td>
                <td><span id="cp6_SqSize"></span></td>
                <td><button id="cp6_Spend">Spend</button></td>
            </tr>
            <!-- <tr> <-- Captain 7 -- --
                <td><span id="cp7_Name"></span></td>
                <td><span id="cp7_Purse"></span></td>
                <td><span id="cp7_SqSize"></span></td>
                <td><button id="cp7_Spend">Spend</button></td>
            </tr>
            <tr> <-- Captain 8 --
                <td><span id="cp8_Name"></span></td>
                <td><span id="cp8_Purse"></span></td>
                <td><span id="cp8_SqSize"></span></td>
                <td><button id="cp8_Spend">Spend</button></td>
            </tr> -->
            <tr>
                <td><button id="sendtodraft">Send to Draft</button></td>
                <td><span id="draftCount"></span></td>
            </tr>


        </table>


        <div class="playerDisp" id="playerDisp" style="display:none;">
            <div id="playerName"></div>
            <div id="playerBatch"></div>
        </div>

    </div>


    <div id="adminops" class="admbtn-group" style="width:100%; display:none;">
        <!-- <button style="margin-left:10%;" id="startbid"> Start Bids</button> -->
        <button style="margin-left:46%;" id="startauc"> Start Auction</button>
        <button style="margin-left:30%" id="stopbid">Next</button>
    </div>


</body>

</html>
